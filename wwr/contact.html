<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - WhiteWater Rafting Adventures</title>
    <meta name="description"
      content="WhiteWater offers guided rafting trips, family adventures, and eco-friendly river excursions in the Pacific Northwest.">
    <meta name="author" content="Mercy Goms">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="logo rafting">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-address">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Stree <br>
                Kolob, California
            </address>
            <span>+1 999 999 9999</span>
            <span>info@whitewater.com</span>
        </section>
        <section class="contact">
            <div class="location">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3187.315746176722!2d-122.02913262419125!3d36.97839575763448!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808e402563ff7b33%3A0x5912c5ee33d84140!2s123%20River%20St%2C%20Santa%20Cruz%2C%20CA%2095060%2C%20%C3%89tats-Unis!5e0!3m2!1sfr!2scd!4v1780829065847!5m2!1sfr!2scd"
                  width="300" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact-form">

                <div>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>
                <div>
                    <label>Message Purpose</label>
                    <div>
                        <span>
                            <input type="radio" name="purpose" id="general">
                            <label for="general">General Inquiry</label>
                        </span>
                        <span>
                            <input type="radio" name="purpose" id="reservation">
                            <label for="reservation">Reservation Question</label>
                        </span>
                        <span>
                            <input type="radio" name="purpose" id="website">
                            <label for="website">Website suggestion</label>
                        </span>
                    </div>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>
                <div>
                    <span>
                        <input type="checkbox" name="newsletter" id="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </span>
                </div>
                <button type="submit">Get In touch!</button>
            </form>
        </section>
        <section>
            <h2>We are here to serve you</h2>
            <div class="employee">
                <figure>
                    <img src="images/employee-placeholder.png" alt="customer happy">
                    <figcaption>Employee</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-placeholder.png" alt="customer happy">
                    <figcaption>Employee</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-placeholder.png" alt="customer happy">
                    <figcaption>Employee</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 - WhiteWater - Mercy Mbungu</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="facebook"
                  width="50"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="instagram"
                  width="50"></a>
            <a href="https://whatsapp.com"><img src="images/whatsapp.svg" alt="whatsapp"
                  width="50"></a>
        </nav>
    </footer>
</body>

</html>
