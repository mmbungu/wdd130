<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form action="">
            <fieldset>
                <legend>Contant Information</legend>
                <label for="fullname">Fullname :</label>
                <input type="text" name="fullname" id="fullname" required>

                <label for="email">Email :</label>
                <input type="email" name="email" id="email" required>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>

                <label for="quantity">Select Quantity</label>
                <label for="browser">What is your favorite internet browser?</label> <select
                  id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
                <label for="pet">Do you have a household pet?</label> <input type="checkbox"
                  id="pet" name="pet">
                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 - Mercy Mbungu</p>
    </footer>
</body>

</html>
